name: Ajustar puestos operativos
on:
  push:
    branches: [rotacion-vigilantes-ayudantes]
    paths: ['.github/workflows/deploy-supabase.yml']
jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar y comprobar puestos
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          cat > consulta.sql <<'SQL'
          do $$
          declare par record;
          begin
           for par in select * from (values ('Vigilante Diurno','Vigilante 1','Vigilante'),('Vigilante Nocturno','Vigilante 2','Vigilante'),('Ayudante de mecánico','Ayudante de mecánico 1','Ayudante de mecánico')) v(anterior,nuevo,cargo) loop
           update public.boss_nomina_personal p set nombre=par.nuevo where p.cargo=par.cargo and p.nombre=par.anterior;
           if (select count(*) from public.boss_nomina_personal p where p.cargo=par.cargo and p.nombre=par.nuevo)<>1 then raise exception 'Revisar puesto'; end if;
           end loop;
           insert into public.boss_nomina_personal(nombre,cargo,desde) select 'Ayudante de mecánico 2',cargo,desde from public.boss_nomina_personal where nombre='Ayudante de mecánico 1' and cargo='Ayudante de mecánico' on conflict do nothing;
           if not exists(select 1 from public.boss_nomina_personal where nombre='Ayudante de mecánico 2' and cargo='Ayudante de mecánico' and desde=date '2026-11-16') then raise exception 'Verificar alta'; end if;
          end $$;
          SQL
          jq -Rs '{query:.}' consulta.sql | curl -fsS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @- https://api.supabase.com/v1/projects/syixumzybwcqumaszzqa/database/query
