name: Deploy Supabase Functions

on:
  workflow_dispatch:

concurrency:
  group: boss-metal-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: syixumzybwcqumaszzqa
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Aplicar y verificar esquema de supervisores
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          {
            printf 'begin;\n'
            cat supabase/migrations/20261121230000_boss_acarreos.sql
            cat supabase/migrations/20261121230500_boss_crear_supervisor.sql
            cat supabase/migrations/20261121231000_boss_lectura_sesiones.sql
            cat supabase/migrations/20261121231500_boss_resumen_operacion.sql
            cat supabase/migrations/20261121232500_boss_solicitudes_materiales.sql
            cat supabase/migrations/20261121233000_boss_categorias_materiales.sql
            cat supabase/migrations/20261121233500_boss_responsable_acarreo.sql
            cat supabase/migrations/20261122101500_boss_destinos_materiales.sql
            cat supabase/migrations/20261122102000_boss_disponibilidad_equipos.sql
            cat supabase/migrations/20261122102500_boss_registro_unico_turno.sql
            cat <<'SQL'
          select set_config('boss.deploy_test_user', 'PruebaDeploy_' || substr(md5(random()::text), 1, 10), true);
          set local role service_role;
          do $$
          begin
            insert into public.boss_disponibilidad_equipos (clave, nombre, estado, actualizado_por)
            values ('equipo:d8r', 'Bulldozer D8R', 'Operativo', 'PruebaDeploy')
            on conflict (clave) do update set estado = excluded.estado, actualizado_por = excluded.actualizado_por;
            update public.boss_disponibilidad_equipos set estado = 'Fuera de servicio' where clave = 'equipo:d8r';
            if not exists (select 1 from public.boss_disponibilidad_equipos
                           where clave = 'equipo:d8r' and estado = 'Fuera de servicio') then
              raise exception 'No se pudo comprobar el cambio de disponibilidad';
            end if;
            raise exception using errcode = 'BM001', message = 'Revertir la comprobación de disponibilidad';
          exception when sqlstate 'BM001' then
            null;
          end;
          $$;
          do $$
          declare
            prueba text := 'PruebaAdmin-' || gen_random_uuid();
          begin
            insert into public.boss_acarreos
              (id, registrado_por, fecha, turno, unidad, viajes, capacidad_m3, densidad, equipo, responsable)
            values (prueba, 'Admin', date '1900-01-01', 'Diurno', '43', 1, 20, 0.83, 'Prueba', 'Responsable de prueba');
            if not exists (select 1 from public.boss_acarreos where id = prueba and responsable = 'Responsable de prueba') then
              raise exception 'No se pudo comprobar el registro de Admin';
            end if;
            begin
              insert into public.boss_acarreos
                (id, registrado_por, fecha, turno, unidad, viajes, capacidad_m3, densidad, equipo)
              values (prueba || '-duplicado', 'SupervisorPrueba', date '1900-01-01', 'Diurno', '43', 1, 20, 0.83, 'Prueba');
              raise exception 'La base aceptó un total repetido';
            exception when unique_violation then
              null;
            end;
            update public.boss_acarreos
            set viajes = 2, actualizado_por = 'Admin2', actualizado_en = now() where id = prueba;
            if not exists (
              select 1 from public.boss_acarreos_correcciones
              where acarreo_id = prueba and corregido_por = 'Admin2'
                and antes->>'viajes' = '1' and despues->>'viajes' = '2'
            ) then
              raise exception 'La corrección no quedó registrada';
            end if;
            raise exception using errcode = 'BM001', message = 'Retirar el registro temporal';
          exception when sqlstate 'BM001' then
            null;
          end;
          $$;
          do $$
          declare
            prueba uuid := gen_random_uuid();
          begin
            insert into public.boss_solicitudes_materiales
              (id, solicitado_por, categoria, descripcion, cantidad)
            values (prueba, 'PruebaDeploy', 'EPP', 'Verificación temporal', 1);
            insert into public.boss_solicitudes_materiales
              (id, solicitado_por, categoria, descripcion, cantidad)
            select gen_random_uuid(), 'PruebaDeploy', categoria, 'Verificación temporal', 1
            from (values ('Filtros'), ('Repuestos'), ('Otros')) as nuevas(categoria);
            insert into public.boss_solicitudes_materiales
              (id, solicitado_por, categoria, descripcion, cantidad, equipo_adicional, vehiculo)
            select gen_random_uuid(), 'PruebaDeploy', 'Filtros', 'Verificación temporal', 1, equipo, vehiculo
            from (values ('Bulldozer D8R', null), ('Payloader HL770', null),
                         ('Jumbo', null), ('Vehículo', 'Camioneta de prueba')) destinos(equipo, vehiculo);
            update public.boss_solicitudes_materiales set estado = 'Aprobada' where id = prueba;
            if not exists (select 1 from public.boss_solicitudes_materiales where id = prueba and estado = 'Aprobada') then
              raise exception 'No se pudo comprobar el flujo de solicitudes';
            end if;
            raise exception using errcode = 'BM001', message = 'Retirar la solicitud temporal';
          exception when sqlstate 'BM001' then
            null;
          end;
          $$;
          select public.boss_resumen_operacion(current_date, current_date) ? 'viajes' as resumen_disponible;
          select usuario_id from public.boss_sesiones where token_hash = repeat('0', 64) and expira_en > now();
          select public.boss_crear_supervisor(current_setting('boss.deploy_test_user'), '7419');
          reset role;
          do $$
          declare
            nombre text := current_setting('boss.deploy_test_user');
          begin
            if public.boss_verificar_pin(nombre, '7419') is distinct from true then
              raise exception 'El verificador no admite la cuenta de supervisor';
            end if;
            delete from public.boss_usuarios where usuario = nombre;
          end;
          $$;
          notify pgrst, 'reload schema';
          commit;
          SQL
          } | jq -Rs '{query: .}' | curl --fail-with-body --silent --show-error \
            --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' --data-binary @- \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"

      - name: Desplegar boss-acarreos
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy boss-acarreos --no-verify-jwt \
            --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Desplegar boss-login
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy boss-login --no-verify-jwt \
            --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Verificar que acarreo exige una sesión
        run: |
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --data '{"accion":"listar"}' \
            "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/boss-acarreos")"
          test "$status" = 401
