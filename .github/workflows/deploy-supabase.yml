name: Deploy Supabase Functions

on:
  workflow_dispatch:
  push:
    branches: [tablero-operacion]
    paths: ['.github/workflows/deploy-supabase.yml']

concurrency:
  group: boss-metal-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: syixumzybwcqumaszzqa
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Aplicar y verificar esquema de supervisores
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          {
            printf 'begin;\n'
            cat supabase/migrations/20261121230000_boss_acarreos.sql
            cat supabase/migrations/20261121230500_boss_crear_supervisor.sql
            cat supabase/migrations/20261121231000_boss_lectura_sesiones.sql
            cat supabase/migrations/20261121231500_boss_resumen_operacion.sql
            cat <<'SQL'
          select set_config('boss.deploy_test_user', 'PruebaDeploy_' || substr(md5(random()::text), 1, 10), true);
          set local role service_role;
          select public.boss_resumen_operacion(current_date, current_date) ? 'viajes' as resumen_disponible;
          select usuario_id from public.boss_sesiones where token_hash = repeat('0', 64) and expira_en > now();
          select public.boss_crear_supervisor(current_setting('boss.deploy_test_user'), '7419');
          reset role;
          do $$
          declare
            nombre text := current_setting('boss.deploy_test_user');
          begin
            if public.boss_verificar_pin(nombre, '7419') is distinct from true then
              raise exception 'El verificador no admite la cuenta de supervisor';
            end if;
            delete from public.boss_usuarios where usuario = nombre;
          end;
          $$;
          notify pgrst, 'reload schema';
          commit;
          SQL
          } | jq -Rs '{query: .}' | curl --fail-with-body --silent --show-error \
            --request POST --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' --data-binary @- \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"

      - name: Desplegar boss-acarreos
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy boss-acarreos --no-verify-jwt \
            --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Desplegar boss-login
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy boss-login --no-verify-jwt \
            --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Verificar que acarreo exige una sesión
        run: |
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --data '{"accion":"listar"}' \
            "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/boss-acarreos")"
          test "$status" = 401
