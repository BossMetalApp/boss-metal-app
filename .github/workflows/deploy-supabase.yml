name: Alta de cinco puestos provisionales
on:
  push:
    branches: [alta-cinco-puestos-operativos]
    paths: ['.github/workflows/deploy-supabase.yml']
jobs:
  alta:
    runs-on: ubuntu-latest
    steps:
      - name: Registrar y verificar cinco puestos desde el 16 de noviembre
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/puestos.sql" <<'SQL'
          do $$
          declare puesto record;
          begin
            for puesto in select * from (values
              ('Mecánico','Mecánico'),('Ayudante de mecánico','Ayudante de mecánico'),('Chequeador','Chequeador'),
              ('Vigilante 1','Vigilante'),('Vigilante 2','Vigilante')) as puestos(nombre,cargo)
            loop
              insert into public.boss_nomina_personal(nombre,cargo,desde)
              values(puesto.nombre,puesto.cargo,date '2026-11-16') on conflict do nothing;
              if not exists(select 1 from public.boss_nomina_personal p
                where lower(trim(p.nombre))=lower(puesto.nombre) and p.cargo=puesto.cargo and p.desde=date '2026-11-16')
              then raise exception 'Revisar alta de %',puesto.nombre; end if;
            end loop;
          end $$;
          SQL
          jq -Rs '{query: .}' "$RUNNER_TEMP/puestos.sql" | curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @- https://api.supabase.com/v1/projects/syixumzybwcqumaszzqa/database/query
