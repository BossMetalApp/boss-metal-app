name: Renombrar puestos de vigilancia
on:
  push:
    branches: [renombrar-vigilantes-turno]
    paths: ['.github/workflows/deploy-supabase.yml']
jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Renombrar y verificar ambos puestos
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          cat > consulta.sql <<'SQL'
          do $$
          declare par record;
          begin
           for par in select * from (values ('Vigilante 1','Vigilante Diurno'),('Vigilante 2','Vigilante Nocturno')) v(anterior,nuevo) loop
           update public.boss_nomina_personal set nombre=par.nuevo where cargo='Vigilante' and nombre=par.anterior;
           if (select count(*) from public.boss_nomina_personal where cargo='Vigilante' and nombre=par.nuevo)<>1 then raise exception 'Revisar puesto de vigilancia'; end if;
           end loop;
          end $$;
          SQL
          jq -Rs '{query:.}' consulta.sql | curl -fsS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @- https://api.supabase.com/v1/projects/syixumzybwcqumaszzqa/database/query
