name: Publicar consulta compartida
on:
  push:
    branches: [solicitudes-compartidas-lectura]
    paths: ['.github/workflows/deploy-supabase.yml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Publicar boss-acarreos
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy boss-acarreos --no-verify-jwt --project-ref syixumzybwcqumaszzqa --yes
