name: Consulta de resumen agregado
on:
  push:
    branches: [consulta-resumen-22-nov]
jobs:
  consulta:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar acumulado
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          jq -n --arg query "select unidad, sum(viajes) filter(where turno='Diurno') d,sum(viajes) filter(where turno='Nocturno') n,round(sum(viajes*capacidad_m3*densidad) filter(where turno='Diurno'),2) td,round(sum(viajes*capacidad_m3*densidad) filter(where turno='Nocturno'),2) tn,round(sum(viajes*capacidad_m3),2) m,round(sum(viajes*capacidad_m3*densidad),2) t,min(fecha) inicio from public.boss_acarreos where fecha<=date '2026-11-22' group by unidad order by unidad" '{query:$query}' | curl -fsS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @- https://api.supabase.com/v1/projects/syixumzybwcqumaszzqa/database/query > resultado.json
      - uses: actions/upload-artifact@v4
        with:
          name: resumen
          path: resultado.json
          retention-days: 1
