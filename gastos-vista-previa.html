<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gastos · Boss Metal</title><style>*{box-sizing:border-box}body{margin:0;background:#edf2f6;color:#183750;font:16px system-ui}main{max-width:560px;margin:auto;padding:16px}header,section,form{padding:16px;background:white;border-radius:14px;margin-bottom:12px}header{background:#173851;color:white;border-top:4px solid #efba19}h1,h2,p{margin:0 0 10px}h2{font-size:18px}strong{font-size:30px}input,select,button{font:inherit;padding:9px;border:1px solid #c5d1db;border-radius:8px;max-width:100%}button{background:#176d54;color:white}label{display:block;margin:8px 0}summary{padding:12px 0;cursor:pointer;border-bottom:1px solid #e4e9ed}b{float:right;font-variant-numeric:tabular-nums}small{display:block;padding:7px;color:#516675}form input,form select{width:100%}fieldset{border:0;margin:0;padding:0;display:flex;gap:4px}fieldset label{position:relative;flex:1;text-align:center}fieldset span{display:block;padding:10px 2px;background:#edf2f6;border-radius:8px}fieldset input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0}fieldset input:checked+span{background:#173851;color:white}fieldset input:focus-visible+span{outline:2px solid #176d54}</style><main><h1>Gastos</h1><p>Constructora Boss Metal · Vista de prueba</p><section><fieldset id="mode"><legend>Ver por</legend><label><input type="radio" name="periodo" value="Día" ><span>Día</span></label><label><input type="radio" name="periodo" value="Quincena" checked><span>Quincena</span></label><label><input type="radio" name="periodo" value="Mensual" ><span>Mensual</span></label></fieldset><label>Fecha <input type="date" id="date" value="2026-11-22" required></label></section><header><p id="period"></p>Total del período<br><strong id="total"></strong></header><div id="groups"></div><button id="add">＋ Registrar gasto de prueba</button><form id="form" hidden><h2>Registrar gasto de prueba</h2><label>Fecha <input name="day" type="date" required></label><label>Concepto <input name="concept" required maxlength="120"></label><label>Monto en USD <input name="amount" type="number" min=".01" step=".01" required></label><label>Partida <select name="cat"><option>Repuestos</option><option>Aceites</option><option>Mangueras</option><option>Filtros</option><option>Oficina</option><option>Comida</option><option>Operacionales</option></select></label><label>Asignado a <select name="unit"></select></label><button>Agregar al ejemplo</button> <button type="button" id="cancel">Cancelar</button></form><small>Importes ilustrativos. Los cambios de prueba duran hasta cerrar o recargar esta página.</small></main><script>
const by=id=>document.getElementById(id),fmt=n=>'USD '+n.toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2});
const units=['General','Unidad 43 · Mack amarillo','Unidad 44 · Pegaso rojo','Unidad 45 · Iveco blanco','Unidad 46 · Maz azul','Bulldozer D8R','Payloader HL770','Jumbo'];
const entries=[['2026-11-22','Filtro de aceite',45,'Filtros',units[1]],['2026-11-22','Bomba de toma de fuerza',650,'Repuestos',units[3]],['2026-11-21','Manguera hidráulica',75,'Mangueras',units[5]],['2026-11-21','Aceite hidráulico',180,'Aceites',units[6]],['2026-11-20','Papelería',75,'Oficina','General'],['2026-11-21','Nómina de ejemplo',300,'Nómina',''],['2026-11-22','Nómina de ejemplo',400,'Nómina','']];
const form=by('form');units.forEach(x=>form.elements.unit.add(new Option(x,x)));
function bounds(date,mode){
  if(mode==='Día')return [date,date];
  const [year,month,day]=date.split('-').map(Number);
  const prefix=date.slice(0,8),last=new Date(year,month,0).getDate();
  if(mode==='Mensual')return [prefix+'01',prefix+last];
  return day<=15?[prefix+'01',prefix+'15']:[prefix+'16',prefix+last];
}
function draw(){const date=by('date').value;if(!date)return;const [start,end]=bounds(date,document.querySelector('input[name="periodo"]:checked').value),rows=entries.filter(r=>r[0]>=start&&r[0]<=end),sum=rs=>rs.reduce((s,r)=>s+Math.round(r[2]*100),0)/100,display=d=>d.split('-').reverse().join('/');by('period').textContent=start===end?display(start):display(start)+' al '+display(end);by('total').textContent=fmt(sum(rows));const root=by('groups');root.replaceChildren();
function section(name){const s=document.createElement('section'),h=document.createElement('h2');h.textContent=name;s.append(h);root.append(s);return s}
function group(parent,label,items){const d=document.createElement('details'),h=document.createElement('summary'),b=document.createElement('b');h.append(label);b.textContent=fmt(sum(items));h.append(b);d.append(h);parent.append(d);return d}
function detail(parent,items){for(const [day,concept,value,,unit] of items){const line=document.createElement('small');line.textContent=[display(day),concept,unit,fmt(value)].filter(Boolean).join(' · ');parent.append(line)}if(!items.length)parent.append('Sin gastos en este período.')}
const cat=section('Resumen por partida');for(const name of ['Nómina','Repuestos','Consumibles','Oficina','Comida','Operacionales']){const cons=['Aceites','Mangueras','Filtros'],items=rows.filter(r=>name==='Consumibles'?cons.includes(r[3]):r[3]===name),g=group(cat,name,items);if(name==='Consumibles'){for(const c of cons){const part=items.filter(r=>r[3]===c);detail(group(g,c,part),part)}}else detail(g,items)}
const eq=section('Por unidad o equipo'),assigned=rows.filter(r=>units.slice(1).includes(r[4]));for(const u of new Set(assigned.map(r=>r[4]))){const items=assigned.filter(r=>r[4]===u);detail(group(eq,u,items),items)}if(!assigned.length)eq.append('Sin gastos asignados.');const general=rows.filter(r=>r[4]==='General');detail(group(section('Gastos generales'),'General',general),general)}
by('date').onchange=by('mode').onchange=draw;by('add').onclick=()=>{form.hidden=false;form.elements.day.value=by('date').value;form.scrollIntoView()};by('cancel').onclick=()=>form.hidden=true;form.onsubmit=e=>{e.preventDefault();const f=form.elements;entries.push([f.day.value,f.concept.value,Number(f.amount.value),f.cat.value,f.unit.value]);by('date').value=f.day.value;form.reset();form.hidden=true;draw()};if(location.hash==='#mensual')document.querySelector('input[value="Mensual"]').checked=true;draw();
</script></html>
